[package]
name = "wgrc-bridge"
version = "0.1.0"
edition = "2021"

[lib]
name = "wgrc_bridge"
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=1.2.2"
anchor-spl = { version = "=1.2.2", features = ["metadata"] }
bs58 = { version = "0.5.1", features = ["check"] }
